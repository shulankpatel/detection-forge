title: LSASS Memory Credential Access
id: 0a1f8b10-0002-4000-8000-000000000002
status: experimental
description: Detects suspicious process access to LSASS memory with access masks commonly used by credential-dumping tools such as Mimikatz.
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: \lsass.exe
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  condition: selection
falsepositives:
  - Endpoint security and backup agents that legitimately read process memory.
level: high
tags:
  - attack.credential_access
  - attack.t1003.001
