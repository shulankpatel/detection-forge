title: Linux SSH Lateral Movement
id: 0a1f8b10-000b-4000-8000-000000000011
status: experimental
description: Detects SSH daemon (sshd) spawning a shell or command interpreter, which may indicate lateral movement or remote code execution.
logsource:
  product: linux
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith: /sshd
  selection_shell:
    Image|endswith:
      - /bash
      - /sh
      - /dash
      - /zsh
  condition: selection_parent and selection_shell
falsepositives:
  - Legitimate SSH login shells initiated by sshd (expected behavior).
level: medium
tags:
  - attack.lateral_movement
  - attack.t1021.004
