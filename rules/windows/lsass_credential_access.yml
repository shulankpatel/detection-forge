title: LSASS Memory Credential Access
id: 0a1f8b10-0002-4000-8000-000000000002
status: experimental
description: Detects suspicious process access to LSASS memory with access masks commonly used by credential-dumping tools such as Mimikatz, and the broad-access masks used by meterpreter/comsvcs.dll MiniDump.
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: \lsass.exe
    GrantedAccess:
      - '0x1010'        # Mimikatz sekurlsa
      - '0x1410'        # Mimikatz sekurlsa (alt)
      - '0x1438'
      - '0x143a'
      - '0x1f1fff'      # broad access used by meterpreter/comsvcs MiniDump (validated vs EVTX-ATTACK-SAMPLES)
      - '0x001f1fff'    # same mask, leading-zero format as logged by some Sysmon builds
      - '0x1f3fff'      # full-access dump mask seen in the wild
      - '0x1fffff'      # PROCESS_ALL_ACCESS
  condition: selection
falsepositives:
  - Endpoint security and backup agents that legitimately read process memory.
level: high
tags:
  - attack.credential_access
  - attack.t1003.001
