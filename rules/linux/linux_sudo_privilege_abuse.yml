title: Linux Sudo Privilege Abuse
id: 0a1f8b10-0009-4000-8000-000000000009
status: experimental
description: Detects sudo commands spawning a shell with flags that could indicate privilege escalation attempts or shell access bypass.
logsource:
  product: linux
  category: process_creation
detection:
  selection_sudo:
    Image|endswith:
      - /sudo
  selection_shell:
    CommandLine|contains:
      - ' -s'
      - ' bash'
      - ' sh'
      - ' -i'
  condition: selection_sudo and selection_shell
falsepositives:
  - Legitimate administrators using sudo to spawn interactive shells for maintenance.
level: high
tags:
  - attack.privilege_escalation
  - attack.t1548.003
